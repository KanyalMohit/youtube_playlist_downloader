<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Downloader</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    h1 {
      text-align: center;
      color: #fff;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 4px;
      font-size: 16px;
    }
    input, select {
      background-color: #1e1e1e;
      color: #fff;
    }
    button {
      background-color: #03dac6;
      color: #000;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #00c4b4;
    }
    .progress {
      margin-top: 20px;
    }
    .folder-path {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 10px;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      margin: 10px 0;
    }
    .checkbox-container input[type="checkbox"] {
      width: auto;
      margin-right: 10px;
    }
    .checkbox-container label {
      color: #e0e0e0;
    }
    .select-container {
      margin: 10px 0;
    }
    .select-container label {
      display: block;
      margin-bottom: 5px;
      color: #e0e0e0;
    }
    .error-message {
      color: #ff4444;
      margin-top: 10px;
      padding: 10px;
      background-color: rgba(255, 68, 68, 0.1);
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>YouTube Downloader</h1>
  <button id="selectFolderBtn">📁 Select Download Folder</button>
  <div class="folder-path" id="folderPath">📂 No folder selected</div>
  <input id="urlInput" type="text" placeholder="Paste YouTube URL here" />
  <div class="select-container">
    <label for="formatSelect">Audio Format:</label>
    <select id="formatSelect">
      <option value="webm">WebM (best quality)</option>
      <option value="mp3">MP3 (convert)</option>
    </select>
  </div>
  <div class="checkbox-container">
    <input type="checkbox" id="playlistCheckbox">
    <label for="playlistCheckbox">This is a playlist URL</label>
  </div>
  <button id="downloadBtn">Download</button>

  <div class="progress" id="progressText">Progress: 0%</div>
  <div class="error-message" id="errorText"></div>

  <script>
    const urlInput = document.getElementById('urlInput');
    const formatSelect = document.getElementById('formatSelect');
    const downloadBtn = document.getElementById('downloadBtn');
    const selectFolderBtn = document.getElementById('selectFolderBtn');
    const folderPathDisplay = document.getElementById('folderPath');
    const progressText = document.getElementById('progressText');
    const errorText = document.getElementById('errorText');
    const playlistCheckbox = document.getElementById('playlistCheckbox');

    const updateFolderDisplay = (path) => {
      folderPathDisplay.textContent = path ? `📂 ${path}` : '📂 No folder selected';
    };

    const showError = (message) => {
      errorText.textContent = message;
      errorText.style.display = 'block';
      progressText.textContent = '❌ Download failed';
    };

    const clearError = () => {
      errorText.style.display = 'none';
      errorText.textContent = '';
    };

    selectFolderBtn.addEventListener('click', async () => {
      const folder = await window.electronAPI.selectDownloadFolder();
      updateFolderDisplay(folder);
    });

    downloadBtn.addEventListener('click', () => {
      const url = urlInput.value.trim();
      const format = formatSelect.value;
      const isPlaylist = playlistCheckbox.checked;
      if (url) {
        clearError();
        window.electronAPI.downloadAudio(url, format, isPlaylist);
        progressText.textContent = 'Starting...';
      }
    });

    window.electronAPI.onProgress((data) => {
      progressText.textContent = `Song ${data.songNumber}: ${data.percent}%`;
    });

    window.electronAPI.onComplete(() => {
      progressText.textContent = '✅ Download complete!';
      clearError();
    });

    window.electronAPI.onError((message) => {
      showError(message);
    });

    // Load saved folder on app start
    window.electronAPI.getSavedFolder().then(updateFolderDisplay);
  </script>
</body>
</html>
